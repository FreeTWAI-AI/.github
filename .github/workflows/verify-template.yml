name: Verify repository template

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify pinned Platform contract source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-contracts.mjs --remote
      - name: Verify manifest schema and observed repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-project-manifest.py --github
      - name: Test repository behavior
        run: npm test
      - name: Build local artifacts when supported
        run: npm run build --if-present
